<!doctype html>
<!-- Plantilla de la imagen para redes (1200×630). Se convierte a PNG con: npm run og -->
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Fraunces'; src: url('../public/fonts/fraunces-latin-full-normal.woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Fraunces'; src: url('../public/fonts/fraunces-latin-full-italic.woff2'); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../public/fonts/jetbrains-mono-latin-400-normal.woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #0d0d0f; color: #f2eee6; overflow: hidden; }
  body { padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: #a29e97; display: flex; justify-content: space-between; }
  .mono b { font-weight: 400; color: #74d1ea; }
  h1 { font-family: 'Fraunces', serif; font-variation-settings: 'opsz' 144; font-weight: 300; font-size: 150px; line-height: .86; text-transform: uppercase; letter-spacing: -.02em; }
  h1 span { display: block; }
  h1 .i { padding-left: 140px; }
  h1 em { font-style: italic; color: #74d1ea; }
  .bottom { border-top: 1px solid #2a2a2e; padding-top: 22px; }
  .role { font-family: 'Fraunces', serif; font-variation-settings: 'opsz' 144; font-size: 40px; text-transform: uppercase; }
  .role em { font-style: italic; color: #74d1ea; font-weight: 300; }
</style>
</head>
<body>
  <div class="mono"><span>Portfolio — 2026</span><span><b>●</b> Santander, ES · Remote</span></div>
  <h1><span><em>Lydia</em></span><span class="i">Vílchez</span><span>López</span></h1>
  <div class="bottom mono"><span class="role" style="color:#f2eee6">Software · <em>Cloud</em> · Security</span></div>
</body>
</html>
